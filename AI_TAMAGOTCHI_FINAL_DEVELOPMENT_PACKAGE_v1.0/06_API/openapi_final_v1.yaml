openapi: 3.0.3
info:
  title: AI Tamagotchi / Lyuboznayka Production API
  version: 1.0.0
  description: Strict final API replacing preliminary v0.1. Numerical Score/HP/XP/goals remain deterministic backend outputs.
servers:
- url: /
  description: Relative provider-neutral API origin
tags:
- name: auth
- name: me
- name: home
- name: tasks
- name: history
- name: goals
- name: ratings
- name: profiles
- name: analytics
- name: notifications
- name: director
- name: executive
- name: admin-users
- name: admin-org
- name: admin-calendar
- name: admin-taxonomy
- name: admin-tools
- name: admin-audit
- name: exports
