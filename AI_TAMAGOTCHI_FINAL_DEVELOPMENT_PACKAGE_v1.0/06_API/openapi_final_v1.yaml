          format: uuid
          nullable: true
        period_from:
          type: string
          format: date
          nullable: true
        period_to:
          type: string
          format: date
          nullable: true
      required:
      - export_type
      - format
      - scope_type
    ExportAccepted:
      type: object
      additionalProperties: false
      properties:
        export_id:
          $ref: '#/components/schemas/Uuid'
        status:
          $ref: '#/components/schemas/ExportStatus'
      required:
      - export_id
      - status
    ExportStatusResponse:
      type: object
      additionalProperties: false
      properties:
        export_id:
          $ref: '#/components/schemas/Uuid'
        status:
          $ref: '#/components/schemas/ExportStatus'
        format:
          type: string
          enum:
          - csv
          - xlsx
        created_at:
          $ref: '#/components/schemas/DateTime'
        completed_at:
          type: string
          format: date-time
          nullable: true
        file_size_bytes:
          type: integer
          minimum: 0
          nullable: true
        sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
          nullable: true
        failure_code:
          type: string
          nullable: true
      required:
      - export_id
      - status
      - format
      - created_at
      - completed_at
      - file_size_bytes
      - sha256
      - failure_code
  responses:
    BadRequest:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Authentication required/failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Role/object scope forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Not found in authorized scope
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Version/state/idempotency conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unprocessable:
      description: Domain state cannot process request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RateLimited:
      description: Rate limit exceeded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    DependencyUnavailable:
      description: Required dependency unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Unexpected internal error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
