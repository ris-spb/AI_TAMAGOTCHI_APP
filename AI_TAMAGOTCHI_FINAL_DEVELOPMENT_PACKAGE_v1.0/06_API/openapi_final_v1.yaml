paths:
  /v1/auth/verify:
    post:
      operationId: verifyPersonnelIdentity
      summary: Verify personnel number + phone
      tags:
      - auth
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthVerifyResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
      x-roles:
      - public
      x-scope: public verification
      x-idempotency:
        mode: none
      x-retry:
        policy: safe_same_credentials
      x-pagination: none
      x-sort: none
      x-filters: []
      x-validation:
      - No self-registration branch.
      x-error-codes:
      - VALIDATION_ERROR
      - AUTH_REQUIRED
      - OBJECT_SCOPE_FORBIDDEN
      - RATE_LIMITED
      - INTERNAL_ERROR
      - DEPENDENCY_UNAVAILABLE
      x-screen-ids:
      - SCR_AUTH_LOGIN
      x-db-refs:
      - employees
      - personnel_provider_links
      - auth_sessions
      - provider_call_attempts
      x-request-schema: AuthVerifyRequest
      x-response-schema: AuthVerifyResponse
      x-example:
        flow: Verify personnel number + phone
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthVerifyRequest'
      x-requirements:
      - PRD-AUTH-001
      - PRD-AUTH-002
      - PRD-AUTH-003
      - PRD-AUTH-004
      - PRD-AUTH-005
      - PRD-AUTH-006
      - PRD-AUTH-007
      - PRD-EXT-001
      - PRD-SCREEN-001
