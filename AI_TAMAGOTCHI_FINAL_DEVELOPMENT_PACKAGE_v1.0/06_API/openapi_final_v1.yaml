components:
  securitySchemes:
    BearerSession:
      type: http
      scheme: bearer
      bearerFormat: opaque-session-token
      description: SAFE_ENGINEERING_DEFAULT. Opaque token issued by current MVP verification; lifecycle/SSO hardening is Stage
        9.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
      description: Required on duplicate-sensitive mutations.
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        minLength: 1
    PageSize:
      name: page_size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    TaskId:
      name: taskId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    EmployeeId:
      name: employeeId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    DirectorateId:
      name: directorateId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    NotificationId:
      name: notificationId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    ExportId:
      name: exportId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    TaxonomyVersionId:
      name: taxonomyVersionId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    CategoryId:
      name: categoryId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    SubcategoryId:
      name: subcategoryId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    ToolId:
      name: toolId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    ClarificationId:
      name: clarificationId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    VersionNo:
      name: versionNo
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    CalendarDate:
      name: date
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Date'
  schemas:
    Uuid:
      type: string
      format: uuid
      example: 11111111-1111-4111-8111-111111111111
    Date:
      type: string
      format: date
      example: '2026-08-31'
    DateTime:
      type: string
      format: date-time
      example: '2026-08-31T13:20:00Z'
    AppRole:
      type: string
      enum:
      - employee
      - director
      - executive
      - admin
    AccountStatus:
      type: string
      enum:
      - active
      - blocked
      - terminated
    PrivacyLevel:
      type: string
      enum:
      - closed
      - standard
      - open
    InputChannel:
      type: string
      enum:
      - text
      - voice
    ComplexityLevel:
      type: string
      enum:
      - C1
      - C2
      - C3
      - C4
      - C5
    HealthState:
      type: string
      enum:
      - happy
      - normal
      - bored
      - tired
      - very_weak
      - coma
    ProcessingStatus:
      type: string
      enum:
      - accepted
      - pending
      - running
      - waiting_clarification
      - completed
      - failed
      - stale
    ExportStatus:
      type: string
      enum:
      - pending
      - running
      - completed
      - failed
      - cancelled
    NotificationType:
      type: string
      enum:
      - pet_health
      - goal
      - streak
      - progress
      - ranking
    ErrorCode:
      type: string
      enum:
      - VALIDATION_ERROR
      - AUTH_REQUIRED
      - AUTH_VERIFICATION_FAILED
      - ACCOUNT_BLOCKED
      - FORBIDDEN
      - OBJECT_SCOPE_FORBIDDEN
      - NOT_FOUND
      - CONFLICT
      - IDEMPOTENCY_KEY_REUSED
      - VERSION_CONFLICT
      - INVALID_CURSOR
      - GOAL_SETUP_REQUIRED
      - GOAL_SETUP_NOT_REQUIRED
      - GOAL_SELECTION_INVALID
      - CLARIFICATION_NOT_PENDING
      - CLARIFICATION_LIMIT_REACHED
      - PROCESSING_NOT_READY
      - PROCESSING_FAILED
      - TASK_DELETED
      - DEPENDENCY_UNAVAILABLE
      - RATE_LIMITED
      - EXPORT_NOT_READY
      - EXPORT_EXPIRED
      - INTERNAL_ERROR
    FieldError:
      type: object
      additionalProperties: false
      properties:
        field:
          type: string
          minLength: 1
        code:
          type: string
          minLength: 1
        message:
          type: string
          minLength: 1
      required:
      - field
      - code
      - message
    ErrorResponse:
      type: object
      additionalProperties: false
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
