<style>
:root{--bg:#f5f1e9;--surface:#faf8f3;--surface2:#e9e1d5;--text:#292824;--muted:#6c675e;--amber:#d39a3c;--amberDark:#9e6e24;--green:#65816b;--red:#b95e56;--border:rgba(41,40,36,.14);--shadow:0 8px 30px rgba(41,40,36,.09)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);font:15px/1.45 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text)}button,input,textarea,select{font:inherit}button{cursor:pointer}.app{min-height:100vh;display:grid;grid-template-columns:260px 1fr}.side{position:sticky;top:0;height:100vh;padding:22px 18px;border-right:1px solid var(--border);background:rgba(250,248,243,.97);display:flex;flex-direction:column;gap:22px}.brand{font-size:20px;font-weight:800}.brand small{display:block;margin-top:4px;font-size:11px;font-weight:500;color:var(--muted)}.badge{display:inline-flex;width:max-content;padding:6px 9px;border:1px dashed var(--amberDark);border-radius:999px;color:var(--amberDark);font-size:11px;font-weight:700}.nav{display:grid;gap:7px}.nav button{min-height:46px;padding:0 12px;border:1px solid transparent;border-radius:10px;background:transparent;text-align:left;color:var(--muted)}.nav button:hover,.nav button.active{background:var(--surface2);color:var(--text);border-color:var(--border)}.sideNote{margin-top:auto;font-size:11px;color:var(--muted)}.main{min-width:0}.top{height:64px;padding:0 22px;border-bottom:1px solid var(--border);background:rgba(250,248,243,.9);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5}.top small{color:var(--muted)}.content{padding:20px}.entryWrap,.stageWrap{min-height:calc(100vh - 105px);display:grid;place-items:center}.phone{width:min(430px,100%);min-height:760px;border:1px solid var(--border);border-radius:26px;background:var(--surface);box-shadow:var(--shadow);overflow:hidden;position:relative}.pad{padding:26px 20px}.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}.phone h1{font-size:26px;line-height:1.15;margin:0 0 10px}.phone h2{font-size:20px;line-height:1.25;margin:0 0 10px}.lead,.muted{color:var(--muted)}.lead{margin:0 0 20px}.field{display:grid;gap:7px;margin:10px 0}.field span{font-size:13px;font-weight:700}.field input,.field textarea,.field select{width:100%;min-height:48px;border:1px solid var(--border);border-radius:10px;background:#fff;padding:10px 12px;color:var(--text)}.field textarea{min-height:150px;resize:vertical}.demoData,.notice{padding:12px;border:1px dashed var(--amberDark);border-radius:10px;background:#fffaf0;font-size:12px}.btn{min-height:52px;border-radius:10px;border:1px solid transparent;padding:0 16px;font-weight:700}.primary{background:var(--amber);color:var(--text)}.secondary{background:var(--surface);border-color:var(--border)}.danger{background:transparent;border-color:var(--red);color:var(--text)}.actions{margin-top:20px;display:flex;gap:10px}.actions>*{flex:1}.stepMeta{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-bottom:20px}.card{border:1px solid var(--border);border-radius:12px;background:#fff;padding:15px}.stepCard{margin:6px 0 22px}.goalList,.stack{display:grid;gap:10px}.goal{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start}.goal input{width:20px;height:20px;accent-color:var(--amberDark)}.goal small{grid-column:2;color:var(--muted)}.goal.disabled{opacity:.55}.system{border-style:dashed;border-color:var(--amberDark)}.mobileMenu{display:none}.homeScene{height:520px;position:relative;background:var(--surface2);overflow:hidden}.homeScene>img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 50%}.homeScene>img.mascotLayer{position:absolute;z-index:1;left:50%;bottom:8%;transform:translateX(-50%);width:78%;height:70%;object-fit:contain;object-position:center bottom;filter:drop-shadow(0 16px 24px rgba(41,40,36,.16));pointer-events:none}.sceneOverlay{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.05),transparent 28%,transparent 70%,rgba(245,241,233,.18))}.hud{position:absolute;z-index:2;top:16px;left:16px;right:16px;display:flex;justify-content:space-between}.hudGroup{display:flex;gap:8px}.pill,.round{min-height:44px;display:grid;place-items:center;border:1px solid rgba(41,40,36,.12);background:rgba(250,248,243,.82);box-shadow:0 1px 6px rgba(41,40,36,.08)}.pill{min-width:54px;padding:0 12px;border-radius:999px;font-weight:800}.round{width:44px;border-radius:50%}.petState{position:absolute;z-index:2;left:50%;bottom:16px;transform:translateX(-50%);min-height:44px;padding:0 14px;border:1px solid rgba(41,40,36,.12);border-radius:999px;background:rgba(250,248,243,.86);font-weight:700}.homeContent{padding:15px 18px 88px;display:grid;gap:13px}.sectionHead{display:flex;justify-content:space-between;align-items:center}.sectionHead h3{margin:0;font-size:14px}.miniGoal{padding:10px 12px;border:1px solid var(--border);border-radius:11px;background:#fff;display:grid;grid-template-columns:1fr auto;gap:6px 10px}.miniGoal span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px}.bar{grid-column:1/-1;height:4px;background:var(--surface2);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--amber)}.bottomNav{position:absolute;left:0;right:0;bottom:0;height:68px;display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-top:1px solid var(--border)}.bottomNav button{border:0;background:transparent;color:var(--muted)}.bottomNav button.active{background:var(--surface2);color:var(--text);font-weight:800}.demoControls{width:min(430px,100%);margin:0 auto 12px;padding:10px 12px;border:1px dashed var(--amberDark);border-radius:10px;background:var(--surface);display:flex;gap:10px;align-items:center;justify-content:space-between;font-size:12px}.demoControls select{min-height:40px;border:1px solid var(--border);border-radius:8px;background:#fff}.processing{min-height:360px;display:grid;place-items:center;text-align:center}.spinner{width:46px;height:46px;border-radius:50%;border:4px solid var(--surface2);border-top-color:var(--amber);animation:spin .9s linear infinite;margin:auto}@keyframes spin{to{transform:rotate(360deg)}}.resultScore{font-size:52px;font-weight:850;line-height:1}.resultLevel{display:inline-flex;padding:6px 10px;border-radius:999px;background:var(--surface2);font-weight:800}.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;padding:5px;background:var(--surface2);border-radius:10px;margin-bottom:12px}.seg button{min-height:44px;border:0;border-radius:8px;background:transparent}.seg button.active{background:#fff;font-weight:800}.row{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--border)}.row:last-child{border-bottom:0}.chip{padding:5px 8px;border-radius:999px;background:var(--surface2);font-size:12px}.metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.metric strong{display:block;font-size:24px}.privacy{display:grid;gap:8px}.privacy button{min-height:58px;padding:10px;text-align:left;border:1px solid var(--border);border-radius:10px;background:#fff}.privacy button.active{background:var(--surface2);border-color:var(--amberDark)}.management{width:min(1180px,100%);min-height:720px;border:1px solid var(--border);border-radius:18px;background:var(--surface);box-shadow:var(--shadow);overflow:hidden}.mgTop{padding:18px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}.roles{display:flex;gap:6px;flex-wrap:wrap}.roles button{min-height:44px;padding:0 12px;border:1px solid var(--border);border-radius:9px;background:#fff}.roles button.active{background:var(--surface2);font-weight:800}.mgBody{padding:22px}.mgMetrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}.mgMetric{border:1px solid var(--border);border-radius:12px;background:#fff;padding:15px}.mgMetric span{display:block;color:var(--muted);font-size:12px}.mgMetric b{font-size:24px}.table{border:1px solid var(--border);border-radius:12px;overflow:hidden;background:#fff}.table .row{padding:13px 15px}.forbidden{padding:60px 20px;text-align:center}.qaGrid{width:min(1050px,100%);display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.qaCard{border:1px solid var(--border);border-radius:14px;background:var(--surface);padding:16px}.qaCard img{display:block;width:100%;max-height:520px;object-fit:contain;border:1px solid var(--border);border-radius:10px;background:#fff}.qaList{margin:0;padding-left:18px;color:var(--muted)}.skip{position:fixed;left:-999px;top:8px}.skip:focus{left:8px;z-index:99;background:#fff;padding:10px;border-radius:8px}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid rgba(112,76,21,.45);outline-offset:2px}@media(max-width:820px){.app{display:block}.side{display:none}.top{min-height:60px;height:auto;padding:10px 12px}.mobileMenu{display:flex;gap:6px;overflow:auto;padding:8px 10px;border-bottom:1px solid var(--border);background:var(--surface)}.mobileMenu button{flex:0 0 auto;min-height:44px;border:1px solid var(--border);border-radius:999px;padding:0 12px;background:#fff}.mobileMenu button.active{background:var(--surface2);font-weight:800}.content{padding:0}.entryWrap,.stageWrap{padding:16px;min-height:calc(100vh - 118px)}.phone{min-height:680px;border-radius:20px}.management{border-radius:15px}.mgMetrics{grid-template-columns:repeat(2,1fr)}.qaGrid{grid-template-columns:1fr}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<div class="app"><aside class="side"><div><div class="brand">Любознайка<small>Working Visual Prototype · Stage 10</small></div><div class="badge" style="margin-top:12px">DEMO · MOCK DATA</div></div><nav class="nav" id="desktopNav"></nav><p class="sideNote">Реальные Personnel / LLM / STT / Object Storage не вызываются. Final GLB отсутствуют — используется approved fallback.</p></aside><section class="main"><header class="top"><div><strong id="sectionTitle"></strong><br><small id="sectionNote"></small></div><div class="badge">OFFLINE DEMO</div></header><nav class="mobileMenu" id="mobileNav"></nav><main class="content" id="content"></main></section></div>
<script>
const ASSETS={bg:'../public/prototype-approved/home-v3/BG_Home_Pulkovo_Default_1024x1536_v2.2.webp',happy:'../public/prototype-approved/home-v3/MSC_Lyuboznayka_Happy_1254_v2.2.webp',normal:'../public/prototype-approved/home-v3/MSC_Lyuboznayka_Normal_1254_v2.2.webp',bored:'../public/prototype-approved/home-v3/MSC_Lyuboznayka_Bored_1254_v2.2.webp',tired:'../public/prototype-approved/home-v3/MSC_Lyuboznayka_Tired_1254_v2.2.webp',very_weak:'../public/prototype-approved/home-v3/MSC_Lyuboznayka_VeryWeak_1254_v2.2.webp',coma:'../public/prototype-approved/home-v3/MSC_Lyuboznayka_Coma_1254_v2.2.webp'};
const sections=[['start','Первый запуск','Login → onboarding → Monthly Goals'],['home','Главная','Mascot fallback · goals · states'],['case','Добавить AI-задачу','Text / voice / processing / 0–3 clarifications / result'],['employee','История · Рейтинг · Профиль','Primary employee sections'],['management','Director · Executive · Admin','Role-aware dashboards and RBAC'],['qa','QA / responsive','Responsive / accessibility / states']];
let current='start',onboardingStep=0,selectedGoals=[],employeeTab='history',ratingSub='employees',privacy='standard',mgRole='Admin',caseMode='text',caseStep='entry',clarCount=2,clarAnswered=0,caseLevel='C3';
const onboarding=[['AI-Тамагочи помогает развивать практику работы с ИИ','Приложение систематизирует реальные рабочие AI-use cases, показывает личный прогресс и помогает формировать регулярную практику использования ИИ.'],['Фиксируйте уже выполненные AI-задачи','Опишите выполненный AI-assisted work case текстом или голосом. Это не список будущих дел: система учитывает только заявленную уже выполненную работу.'],['Complexity оценивается по единой шкале C1–C5','Система классифицирует сложность по наблюдаемым признакам workflow. Фиксированная шкала Score: C1 = 1, C2 = 5, C3 = 15, C4 = 40, C5 = 100.'],['Любознайка отражает регулярность практики','HP, AI Streak и Evolution XP показывают регулярность и долгосрочный прогресс. Питомец не заменяет рабочую аналитику и не блокирует основные действия.'],['Каждый месяц действуют три AI Goals','Система предлагает пять измеримых вариантов: сотрудник выбирает два, а третья цель назначается системой. Прогресс обновляется по зарегистрированным AI-кейсам.']];
const goals=[['g1','Выполни минимум 3 AI-кейса с работой с данными','target 3'],['g2','Используй ИИ минимум в 8 рабочих днях','target 8'],['g3','Попробуй минимум 2 разных AI-инструмента','target 2'],['g4','Выполни минимум 1 AI-кейс уровня C3+','target 1'],['g5','Используй ИИ для research минимум в 2 кейсах','target 2']];
const scores={C1:1,C2:5,C3:15,C4:40,C5:100};
function navMarkup(){return sections.map(s=>`<button data-section="${s[0]}" class="${s[0]===current?'active':''}">${s[1]}</button>`).join('')};function bindNav(){[desktopNav,mobileNav].forEach(r=>{r.innerHTML=navMarkup();r.querySelectorAll('button').forEach(b=>b.onclick=()=>showSection(b.dataset.section))})}
function phone(inner){content.innerHTML=`<div class="entryWrap"><section class="phone"><div class="pad">${inner}</div></section></div>`}function showSection(id){current=id;const s=sections.find(x=>x[0]===id);sectionTitle.textContent=s[1];sectionNote.textContent=s[2];bindNav();({start:renderLogin,home:renderHome,case:renderCase,employee:renderEmployee,management:renderManagement,qa:renderQA}[id])()}
function renderLogin(){phone(`<p class="eyebrow">Первый вход</p><h1>Вход в AI-Тамагочи</h1><p class="lead">Введите табельный номер и телефон. Самостоятельной регистрации аккаунта в MVP нет.</p><label class="field"><span>Табельный номер</span><input id="pn" value="DEMO-001"></label><label class="field"><span>Номер телефона</span><input id="phoneInput" value="+7 900 000-00-01"></label><div class="demoData"><strong>DEMO-данные</strong><br>DEMO-001 · +7 900 000-00-01</div><div class="actions"><button class="btn primary" id="loginBtn">Продолжить</button></div>`);loginBtn.onclick=()=>{if(!pn.value.trim()||!phoneInput.value.trim()){alert('Заполните оба поля.');return}onboardingStep=0;renderOnboarding()}}
function renderOnboarding(){let [t,b]=onboarding[onboardingStep],last=onboardingStep===4;phone(`<div class="stepMeta"><span>Onboarding</span><span>${onboardingStep+1} / 5</span></div><p class="eyebrow">Шаг ${onboardingStep+1}</p><div class="card stepCard"><h2>${t}</h2><p class="muted">${b}</p></div><div class="actions">${onboardingStep?'<button class="btn secondary" id="backBtn">Назад</button>':''}<button class="btn primary" id="nextBtn">${last?'Завершить onboarding':'Далее'}</button></div>`);if(onboardingStep)backBtn.onclick=()=>{onboardingStep--;renderOnboarding()};nextBtn.onclick=()=>last?(selectedGoals=[],renderGoals()):(onboardingStep++,renderOnboarding())}
function renderGoals(){phone(`<p class="eyebrow">Обязательная настройка месяца</p><h1>Выберите 2 Monthly Goals</h1><p class="lead">Пять персонализированных вариантов. Третья цель будет назначена системой.</p><div class="stepMeta"><span>Выбрано: ${selectedGoals.length} из 2</span><span>Вариантов: 5</span></div><div class="goalList">${goals.map(g=>`<label class="card goal ${selectedGoals.length>=2&&!selectedGoals.includes(g[0])?'disabled':''}"><input type="checkbox" data-goal="${g[0]}" ${selectedGoals.includes(g[0])?'checked':''} ${selectedGoals.length>=2&&!selectedGoals.includes(g[0])?'disabled':''}><span>${g[1]}</span><small>${g[2]}</small></label>`).join('')}</div><div class="actions"><button class="btn primary" id="goalsBtn" ${selectedGoals.length===2?'':'disabled'}>Подтвердить 2 цели</button></div>`);document.querySelectorAll('[data-goal]').forEach(c=>c.onchange=()=>{c.checked?selectedGoals.push(c.dataset.goal):selectedGoals=selectedGoals.filter(x=>x!==c.dataset.goal);renderGoals()});goalsBtn.onclick=renderGoalDone}
function renderGoalDone(){let picked=goals.filter(g=>selectedGoals.includes(g[0]));phone(`<p class="eyebrow">Monthly Goals · сентябрь 2026</p><h1>Цели настроены</h1><div class="stack">${picked.map(g=>`<div class="card"><strong>${g[1]}</strong><p class="muted">Выбранная цель · ${g[2]}</p></div>`).join('')}<div class="card system"><strong>Примени минимум 2 разных AI-инструмента</strong><p class="muted">Системная цель · target 2</p></div></div><div class="actions"><button class="btn primary" id="homeBtn">Перейти на главную</button></div>`);homeBtn.onclick=()=>showSection('home')}
function renderHome(){content.innerHTML=`<div class="stageWrap"><div style="width:min(470px,100%)"><div class="demoControls"><b>DEMO Control</b><label>Pet state <select id="petSelect"><option>happy</option><option>normal</option><option>bored</option><option>tired</option><option>very_weak</option><option>coma</option></select></label></div><section class="phone" id="homePhone"><div class="homeScene" id="scene"><img class="bg" id="sceneBg" alt="Утверждённый фон Home — Пулково" src="${ASSETS.bg}"><img class="mascotLayer" id="sceneMascot" alt="Любознайка"><div class="sceneOverlay"></div><div class="hud"><div class="hudGroup"><span class="pill">🔥 10</span><span class="pill">AI 2</span></div><button class="round" aria-label="Уведомления">●</button></div><button class="petState" id="petStateBtn">Бодрый</button></div><div class="homeContent"><div class="sectionHead"><h3>Цели месяца</h3><span class="muted">2 / 3</span></div><div class="miniGoal"><span>Используй ИИ для работы с данными</span><b>1 / 3</b><div class="bar"><i style="width:33%"></i></div></div><div class="miniGoal"><span>Попробуй 2 разных AI-инструмента</span><b>2 / 2</b><div class="bar"><i style="width:100%;background:var(--green)"></i></div></div><div class="miniGoal"><span>Выполни 1 AI-кейс уровня C3+</span><b>0 / 1</b><div class="bar"><i style="width:0"></i></div></div><button class="btn primary" id="addCaseBtn">Добавить AI-задачу</button></div><nav class="bottomNav"><button class="active">Главная</button><button onclick="showSection('employee')">История</button><button onclick="showSection('employee')">Рейтинг</button><button onclick="showSection('employee')">Профиль</button></nav></section></div></div>`;const stateMap={happy:['Бодрый',ASSETS.happy],normal:['Нормальный',ASSETS.normal],bored:['Скучает',ASSETS.bored],tired:['Уставший',ASSETS.tired],very_weak:['Очень слабый',ASSETS.very_weak],coma:['Кома',ASSETS.coma]};function apply(){const state=petSelect.value;let [label,asset]=stateMap[state];petStateBtn.textContent=label;sceneMascot.src=asset;sceneMascot.alt=`Любознайка — ${label}`;scene.className=`homeScene state-${state}`;}petSelect.onchange=apply;apply();addCaseBtn.onclick=()=>showSection('case')}
function renderCase(){if(caseStep==='entry')return renderCaseEntry();if(caseStep==='processing')return renderProcessing();if(caseStep==='clarify')return renderClarify();return renderResult()}
function renderCaseEntry(){phone(`<p class="eyebrow">Уже выполненная AI-assisted работа</p><h1>Добавить AI-задачу</h1><div class="demoData"><label>DEMO clarification count <select id="clarSel"><option>0</option><option>1</option><option selected>2</option><option>3</option></select></label> &nbsp; <label>Result <select id="levelSel">${Object.keys(scores).map(x=>`<option ${x===caseLevel?'selected':''}>${x}</option>`).join('')}</select></label></div><div class="seg" style="grid-template-columns:1fr 1fr"><button id="textMode" class="${caseMode==='text'?'active':''}">Текст</button><button id="voiceMode" class="${caseMode==='voice'?'active':''}">Голос</button></div>${caseMode==='text'?`<label class="field"><span>Что вы уже сделали с помощью ИИ?</span><textarea id="caseText">Проанализировал данные пассажиропотока, с помощью AI написал Python-код, проверил отклонения и подготовил выводы.</textarea></label><label class="field"><span>Ссылки — необязательно</span><input value="https://example.invalid/demo"></label><button class="btn primary" style="width:100%" id="submitCase">Отправить AI-кейс</button>`:`<div class="card processing"><div><h2>Голосовой ввод</h2><p class="muted" id="voiceStatus">Mock microphone ready. Аудио после STT не хранится.</p><button class="btn primary" id="recordBtn">Начать запись</button></div></div>`}`);clarSel.onchange=()=>clarCount=+clarSel.value;levelSel.onchange=()=>caseLevel=levelSel.value;textMode.onclick=()=>{caseMode='text';renderCaseEntry()};voiceMode.onclick=()=>{caseMode='voice';renderCaseEntry()};if(caseMode==='text'){submitCase.onclick=()=>{clarAnswered=0;caseStep='processing';renderCase()}}else{let rec=false;recordBtn.onclick=()=>{if(!rec){rec=true;recordBtn.textContent='Завершить запись';voiceStatus.textContent='Запись…'}else{caseMode='text';renderCaseEntry()}}}}
function renderProcessing(){phone(`<div class="processing"><div><div class="spinner"></div><h2 style="margin-top:18px">Обрабатываем AI-кейс</h2><p class="muted">Extraction → plausibility → taxonomy → scoring → goal matching</p></div></div>`);setTimeout(()=>{caseStep=clarAnswered<clarCount?'clarify':'result';renderCase()},500)}
function renderClarify(){const qs=['Вы использовали AI для анализа самого массива данных или только для формулировки выводов?','Python-код применялся к данным и проверялся на результате?','Это отдельное выполнение, а не повтор уже зарегистрированного кейса?'];phone(`<p class="eyebrow">Уточнение ${clarAnswered+1} из ${clarCount}</p><h1>${qs[clarAnswered]}</h1><p class="lead">Вопросы задаются по одному. Максимум — 3.</p><label class="field"><span>Ответ</span><textarea id="clarAnswer">Да, это было частью выполненного workflow.</textarea></label><button class="btn primary" style="width:100%" id="answerBtn">Ответить</button>`);answerBtn.onclick=()=>{if(!clarAnswer.value.trim())return;clarAnswered++;caseStep='processing';renderCase()}}
function renderResult(){phone(`<p class="eyebrow">AI-кейс зарегистрирован</p><div class="resultLevel">${caseLevel}</div><div class="resultScore">+${scores[caseLevel]}</div><p class="muted">Annual Score</p><div class="card"><strong>Нормализованное описание</strong><p>Анализ массива данных пассажиропотока с использованием AI для Python-кода, проверки отклонений и подготовки выводов.</p></div><div class="card" style="margin-top:10px"><strong>Evolution XP</strong><p>+${scores[caseLevel]} XP</p><strong>Monthly Goals</strong><p class="muted">Работа с данными: +1 · C3+: +${['C3','C4','C5'].includes(caseLevel)?1:0}</p></div><div class="actions"><button class="btn secondary" id="restartCase">Добавить ещё</button><button class="btn primary" onclick="showSection('home')">На главную</button></div>`);restartCase.onclick=()=>{caseStep='entry';clarAnswered=0;renderCase()}}
function renderEmployee(){content.innerHTML=`<div class="stageWrap"><section class="phone"><div class="pad"><p class="eyebrow">Employee</p><h1>${employeeTab==='history'?'История':employeeTab==='rating'?'Рейтинг':'Профиль'}</h1><div class="seg"><button data-et="history" class="${employeeTab==='history'?'active':''}">История</button><button data-et="rating" class="${employeeTab==='rating'?'active':''}">Рейтинг</button><button data-et="profile" class="${employeeTab==='profile'?'active':''}">Профиль</button></div><div id="employeeBody"></div></div><nav class="bottomNav"><button onclick="showSection('home')">Главная</button><button class="${employeeTab==='history'?'active':''}" data-et="history">История</button><button class="${employeeTab==='rating'?'active':''}" data-et="rating">Рейтинг</button><button class="${employeeTab==='profile'?'active':''}" data-et="profile">Профиль</button></nav></section></div>`;document.querySelectorAll('[data-et]').forEach(b=>b.onclick=()=>{employeeTab=b.dataset.et;renderEmployee()});renderEmployeeBody()}
function renderEmployeeBody(){if(employeeTab==='history')employeeBody.innerHTML=`<div class="seg" style="grid-template-columns:1fr 1fr"><button class="active">Задачи</button><button>События</button></div><div class="card"><div class="row"><div><strong>Анализ пассажиропотока</strong><div class="muted">1 сентября · ChatGPT</div></div><span class="chip">C3 · 15</span></div><div class="row"><div><strong>Подготовка справки</strong><div class="muted">31 августа · AI search</div></div><span class="chip">C2 · 5</span></div></div><div class="card" style="margin-top:10px"><strong>Версии выбранного AI-кейса</strong><p class="muted">Версия 2 · текущая · C3 / 15<br>Версия 1 · историческая · C2 / 5</p></div>`;else if(employeeTab==='rating')employeeBody.innerHTML=`<div class="seg"><button class="active">Сотрудники</button><button>Дирекции</button><button>Аналитика</button></div><div class="card"><div class="row"><b>#1</b><strong>Алексей Ветров</strong><b>452</b></div><div class="row"><b>#2</b><strong>Мария Демина</strong><b>391</b></div><div class="row"><b>#8</b><strong>Дмитрий Примеров</strong><b>186</b></div></div>`;else employeeBody.innerHTML=`<div class="metrics"><div class="card metric"><span class="muted">Annual Score</span><strong>186</strong></div><div class="card metric"><span class="muted">Evolution XP</span><strong>684</strong></div><div class="card metric"><span class="muted">AI-кейсы</span><strong>47</strong></div><div class="card metric"><span class="muted">AI-active days</span><strong>31</strong></div></div><h2 style="margin-top:20px">Приватность</h2><div class="privacy">${['closed','standard','open'].map(x=>`<button data-pr="${x}" class="${privacy===x?'active':''}"><strong>${x==='closed'?'Закрытый':x==='standard'?'Стандартный':'Открытый'}</strong><br><span class="muted">${x==='closed'?'Обязательная публичная часть':x==='standard'?'Плюс агрегаты':'Плюс normalized history'}</span></button>`).join('')}</div><div class="notice" style="margin-top:10px">Raw input, clarifications и ссылки коллегам не показываются при любом privacy level.</div>`;document.querySelectorAll('[data-pr]').forEach(b=>b.onclick=()=>{privacy=b.dataset.pr;renderEmployeeBody()})}
function renderManagement(){let body;if(mgRole==='Director')body=`<p class="eyebrow">Own directorate only</p><h1>Director Dashboard</h1><p class="muted">Полная аналитика своей дирекции; technical scoring trace недоступен.</p>${mgMetrics(['Headcount','32'],['Total Score','6 298'],['Average Score','196.8'],['Rank','#2'])}${mgTable([['Алексей Ветров','452'],['Дмитрий Примеров','186']])}`;else if(mgRole==='Executive')body=`<p class="eyebrow">Company-wide drill-down</p><h1>Executive Dashboard</h1><p class="muted">Компания → дирекция → сотрудник → AI-кейс. Admin settings недоступны.</p>${mgMetrics(['Authorized','118'],['AI-кейсы','1 264'],['Avg Score / employee','184.6'],['Goal completion','72%'])}${mgTable([['Коммерческая дирекция','Avg 196.8'],['Цифровые решения','Avg 188.1']])}`;else if(mgRole==='Admin')body=`<p class="eyebrow">System administration</p><h1>Admin Panel</h1><p class="muted">Users / org / calendar / taxonomy / tools / audit / export / technical trace. Manual Score/Complexity override отсутствует.</p>${mgMetrics(['Users','118'],['Directorates','6'],['AI tools','14'],['Audit events','8 421'])}${mgTable([['Сотрудники и роли','PATCH existing employee'],['Taxonomy / AI Tools','CRUD mock'],['Technical scoring trace','READ ONLY'],['Экспорт','XLSX / CSV lifecycle mock']])}`;else body=`<div class="forbidden"><p class="eyebrow">403 · RBAC</p><h1>Management недоступен</h1><p class="muted">Роль Employee не имеет доступа к management/admin screens.</p></div>`;content.innerHTML=`<div class="stageWrap"><section class="management"><div class="mgTop"><div><b>Любознайка · Management</b><div class="muted">DEV-only role switcher</div></div><div class="roles">${['Director','Executive','Admin','Employee'].map(r=>`<button data-role="${r}" class="${mgRole===r?'active':''}">${r}</button>`).join('')}</div></div><div class="mgBody">${body}</div></section></div>`;document.querySelectorAll('[data-role]').forEach(b=>b.onclick=()=>{mgRole=b.dataset.role;renderManagement()})}
function mgMetrics(...xs){return `<div class="mgMetrics">${xs.map(x=>`<div class="mgMetric"><span>${x[0]}</span><b>${x[1]}</b></div>`).join('')}</div>`}function mgTable(xs){return `<div class="table">${xs.map(x=>`<div class="row"><strong>${x[0]}</strong><span class="chip">${x[1]}</span></div>`).join('')}</div>`}
function renderQA(){content.innerHTML=`<div class="stageWrap"><div class="qaGrid"><section class="qaCard"><h2>Viewport matrix</h2><img src="../docs/stage9_browser/STAGE_9_QA_PREVIEW_1440.png" alt="Stage 9 responsive QA matrix"><ul class="qaList"><li>360 px — PASS</li><li>390×844 — PASS</li><li>430 px — PASS</li><li>~1280×900 — PASS</li></ul></section><section class="qaCard"><h2>Accessibility / states</h2><ul class="qaList"><li>44×44 minimum targets</li><li>Visible keyboard focus</li><li>Reduced motion branch</li><li>Loading / empty / error / forbidden</li><li>17/17 current Golden v2 integrity verified</li><li>56/56 runtime visual assets verified</li></ul><h2 style="margin-top:24px">Known environment gap</h2><p class="muted">Full npm-built React/Vite runtime tests remain unexecuted in this execution container. This offline delivery surface is independently runnable and does not call external services.</p></section></div></div>`}
bindNav();showSection('start');
</script></body></html>
