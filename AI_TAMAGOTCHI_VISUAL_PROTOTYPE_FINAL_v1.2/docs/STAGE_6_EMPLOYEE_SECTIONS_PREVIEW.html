<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI-Тамагочи · Stage 6 Preview</title><style>
:root{--bg:#f5f1e9;--surface:#faf8f3;--surface2:#e9e1d5;--text:#292824;--muted:#6c675e;--accent:#d39a3c;--border:rgba(41,40,36,.14);--err:#b95e56;--ok:#65816b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{max-width:430px;min-height:100dvh;margin:auto;background:var(--bg);padding:18px 18px 92px}.eyebrow{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}.head{display:flex;justify-content:space-between;align-items:flex-start;margin:10px 0 18px}.head h1{font-size:24px;line-height:30px;margin:3px 0}.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;box-shadow:0 1px 6px rgba(41,40,36,.06);margin:10px 0}.seg{display:flex;gap:6px;background:var(--surface2);padding:4px;border-radius:10px;margin-bottom:14px}.seg button{flex:1;border:0;background:transparent;border-radius:8px;min-height:40px;color:var(--muted)}.seg button.on{background:var(--surface);color:var(--text);font-weight:700}.row{display:flex;gap:12px;align-items:center;text-decoration:none;color:inherit}.row+.row{border-top:1px solid var(--border);margin-top:12px;padding-top:12px}.grow{flex:1}.row strong{display:block;font-size:15px}.row small,.muted{color:var(--muted);font-size:12px}.chip{min-width:52px;padding:7px 8px;border:1px solid var(--border);border-radius:8px;text-align:center;font-size:12px}.chip b{display:block;font-size:14px}.metricGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric span{display:block;color:var(--muted);font-size:12px}.metric strong{font-size:22px}.goal strong{display:block;font-size:14px}.progress{height:7px;background:var(--surface2);border-radius:999px;overflow:hidden;margin:10px 0}.progress i{display:block;height:100%;background:var(--accent)}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(430px,100%);display:grid;grid-template-columns:repeat(4,1fr);background:rgba(250,248,243,.97);border-top:1px solid var(--border);padding:7px 8px max(7px,env(safe-area-inset-bottom));box-shadow:0 -1px 8px rgba(41,40,36,.05)}.nav button{border:0;background:transparent;min-height:54px;border-radius:8px;color:var(--muted)}.nav button.on{background:rgba(211,154,60,.12);color:var(--text);font-weight:700}.linkBtn{border:1px solid var(--border);background:var(--surface);min-height:44px;padding:8px 12px;border-radius:10px;color:var(--text);font-weight:600}.sectionTitle{font-size:18px;margin:20px 0 8px}.notice{border-left:3px solid var(--accent)}.privacy{display:grid;gap:8px}.privacy button{text-align:left;border:1px solid var(--border);background:var(--surface);padding:12px;border-radius:10px}.privacy button.on{border-color:var(--accent)}.hidden{display:none!important}.qa{margin-top:20px;color:var(--muted);font-size:11px}@media(min-width:800px){.wrap{max-width:980px;padding-bottom:30px}.nav{position:sticky;top:0;bottom:auto;transform:none;left:auto;width:100%;max-width:980px;margin:auto}.metricGrid{grid-template-columns:repeat(4,1fr)}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style></head><body><main class="wrap" id="app"></main><nav class="nav" aria-label="Основная навигация"><button data-tab="home">Главная</button><button data-tab="history" class="on">История</button><button data-tab="rating">Рейтинг</button><button data-tab="profile">Профиль</button></nav><script>
const tasks=[['Проанализирован синтетический массив пассажиропотока, рассчитаны отклонения и подготовлен Python-анализ.','1 сент. · ChatGPT','C3','15'],['Подготовлена структурированная справка по результатам внутреннего исследования.','29 авг. · ChatGPT','C2','5'],['Собран reusable workflow для автоматической подготовки регулярного отчёта.','27 авг. · n8n','C4','40']];
const employees=[['#1','Марина Орлова','486'],['#2','Алексей Ветров','452'],['#3','Дарья Лукина','421'],['#18','Дмитрий Примеров','186']];
const directorates=[['#1','Цифровые решения','214.4'],['#2','Коммерческая дирекция','196.8'],['#3','Финансы','173.1'],['#4','Операционная дирекция','159.7']];
let tab='history',sub='tasks',privacy='standard';
const app=document.querySelector('#app');
function row(t){return `<div class="row"><div class="grow"><strong>${t[0]}</strong><small>${t[1]}</small></div><span class="chip">${t[2]}<b>${t[3]}</b></span></div>`}
function header(e,t,a=''){return `<div class="head"><div><span class="eyebrow">${e}</span><h1>${t}</h1></div>${a}</div>`}
function render(){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));if(tab==='home'){app.innerHTML=header('Stage 4','Главная')+`<div class="card"><strong>Home уже реализован на Stage 4</strong><p class="muted">Этот standalone preview сфокусирован на Employee-разделах Stage 6.</p></div>`;return}
if(tab==='history'){let inner=sub==='tasks'?`<div class="card">${tasks.map(row).join('')}</div><div class="card"><strong>Версии выбранного AI-кейса</strong><p class="muted">Версия 2 · текущая · C3 / 15</p><p class="muted">Версия 1 · историческая · C2 / 5</p><button class="linkBtn" onclick="alert('Edit: меняется только raw input → новая TaskVersion → reprocess. Score/Complexity вручную не редактируются.')">Редактировать</button></div>`:`<div class="card"><div class="row"><div><strong>AI-кейс оценён как C3: +15 Score</strong><small>1 сентября</small></div></div><div class="row"><div><strong>Прогресс Monthly Goal обновлён</strong><small>1 сентября</small></div></div><div class="row"><div><strong>AI Streak: 10 активных рабочих дней</strong><small>28 августа</small></div></div></div>`;app.innerHTML=header('AI Activity Library','История')+`<div class="seg"><button class="${sub==='tasks'?'on':''}" onclick="sub='tasks';render()">Задачи</button><button class="${sub==='events'?'on':''}" onclick="sub='events';render()">События</button></div>${inner}<p class="qa">QA artifact: soft delete сохраняет version/audit history; ежедневный HP noise не выводится.</p>`;return}
if(tab==='rating'){let content;if(sub==='directorates')content=`<div class="card"><label>Сортировка <select><option>По месту</option><option>По Average Score</option><option>По Total Score</option></select></label></div><div class="card">${directorates.map(x=>`<div class="row"><b>${x[0]}</b><div class="grow"><strong>${x[1]}</strong><small>Average Score</small></div><b>${x[2]}</b></div>`).join('')}</div>`;else if(sub==='analytics')content=`<div class="card"><label>Период <select><option>Текущий месяц</option><option>Предыдущий месяц</option><option>Текущий год</option></select></label></div><div class="metricGrid"><div class="card metric"><span>AI-кейсы</span><strong>1 264</strong></div><div class="card metric"><span>Активные сотрудники</span><strong>94</strong></div><div class="card metric"><span>Авторизованы</span><strong>118</strong></div><div class="card metric"><span>Avg Score / сотрудник</span><strong>184.6</strong></div></div><div class="card"><strong>Company-wide aggregates</strong><p class="muted">Без разбивки по дирекциям и без идентификации сотрудников.</p></div>`;else content=`<div class="card"><label>Дирекция <select><option>Все дирекции</option><option>Коммерческая дирекция</option><option>Цифровые решения</option></select></label></div><div class="card">${employees.map(x=>`<div class="row"><b>${x[0]}</b><strong class="grow">${x[1]}</strong><b>${x[2]}</b></div>`).join('')}</div>`;app.innerHTML=header('Annual Score · текущий год','Рейтинг')+`<div class="seg"><button class="${sub==='employees'?'on':''}" onclick="sub='employees';render()">Сотрудники</button><button class="${sub==='directorates'?'on':''}" onclick="sub='directorates';render()">Дирекции</button><button class="${sub==='analytics'?'on':''}" onclick="sub='analytics';render()">Аналитика</button></div>${content}`;return}
if(tab==='profile'){app.innerHTML=header('Коммерческая дирекция','Дмитрий Примеров')+`<div class="metricGrid"><div class="card metric"><span>Annual Score</span><strong>186</strong></div><div class="card metric"><span>Evolution XP</span><strong>684</strong></div><div class="card metric"><span>AI-кейсы</span><strong>47</strong></div><div class="card metric"><span>AI-active days</span><strong>31</strong></div></div><h2 class="sectionTitle">Monthly Goals</h2><div class="card goal"><strong>Выполни 3 AI-кейса уровня C3+</strong><div class="progress"><i style="width:33%"></i></div><small>1 / 3</small></div><div class="card goal"><strong>Используй ИИ в 8 рабочих днях</strong><div class="progress"><i style="width:25%"></i></div><small>2 / 8</small></div><div class="card goal"><strong>Примени минимум 2 разных AI-инструмента</strong><div class="progress"><i style="width:100%"></i></div><small>2 / 2 · системная цель · Выполнено</small></div><h2 class="sectionTitle">Приватность</h2><div class="privacy"><button class="${privacy==='closed'?'on':''}" onclick="privacy='closed';render()"><strong>Закрытый</strong><br><small>Обязательная публичная часть</small></button><button class="${privacy==='standard'?'on':''}" onclick="privacy='standard';render()"><strong>Стандартный</strong><br><small>Плюс агрегаты</small></button><button class="${privacy==='open'?'on':''}" onclick="privacy='open';render()"><strong>Открытый</strong><br><small>Плюс normalized history</small></button></div><div class="card notice"><strong>Peer privacy invariant</strong><p class="muted">Raw input, clarifications и ссылки коллегам не показываются при любом privacy level.</p></div><div class="card"><strong>Achievements</strong><p class="muted">Показываются только полученные. В Stage 6 названия — DEMO placeholder, потому что final catalog не зафиксирован.</p></div>`;}}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;sub=tab==='rating'?'employees':tab==='history'?'tasks':sub;render()});render();
</script></body></html>
