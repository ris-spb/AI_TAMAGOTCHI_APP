<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI-Тамагочи · Stage 7 Preview</title><style>
:root{font-family:Inter,system-ui,sans-serif;color:#25231f;background:#f3efe7;--card:#fffdf8;--line:#ded8cc;--soft:#f0ebe1;--accent:#d6a43d;--muted:#716b61;--ok:#46744a;--bad:#a64b42}*{box-sizing:border-box}body{margin:0}.app{min-height:100vh;display:grid;grid-template-columns:260px 1fr}.side{background:#fffaf1;border-right:1px solid var(--line);padding:24px 18px;display:grid;align-content:start;gap:18px}.brand{font-size:20px;font-weight:800}.brand small{display:block;color:var(--muted);font-size:12px;font-weight:600}.roles{display:grid;grid-template-columns:1fr 1fr;gap:7px}.roles button,.nav button{border:1px solid var(--line);border-radius:10px;background:var(--card);min-height:40px;text-align:left;padding:0 11px;font-weight:700;cursor:pointer}.roles button.active,.nav button.active{border-color:var(--accent);background:#fff6df}.nav{display:grid;gap:6px}.nav button{width:100%}.main{padding:34px;max-width:1180px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;gap:20px;align-items:flex-start}.eyebrow{text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-size:11px;font-weight:800}.top h1{margin:5px 0 4px;font-size:34px}.note{color:var(--muted);margin:0;line-height:1.5}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:22px 0}.metric,.card{border:1px solid var(--line);border-radius:16px;background:var(--card);padding:16px}.metric span{display:block;color:var(--muted);font-size:12px}.metric b{display:block;font-size:27px;margin-top:5px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.card h2{font-size:18px;margin:0 0 12px}.row{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}.tag{font-size:12px;background:var(--soft);border-radius:999px;padding:5px 8px;font-weight:700}.ok{color:var(--ok)}.bad{color:var(--bad)}.forbidden{padding:50px 24px;text-align:center;border:1px solid var(--line);border-radius:18px;background:var(--card)}.forbidden h1{margin:8px 0}.dev{position:fixed;right:18px;bottom:18px;background:#24221e;color:white;border-radius:999px;padding:10px 14px;font-size:11px;font-weight:800}.hide{display:none}@media(max-width:800px){.app{grid-template-columns:1fr}.side{position:static;border-right:0;border-bottom:1px solid var(--line)}.main{padding:20px}.metrics{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.top h1{font-size:28px}}</style></head><body>
<div class="app"><aside class="side"><div class="brand">Любознайка<small>Stage 7 · management preview</small></div><div><div class="eyebrow">DEV role</div><div class="roles" id="roles"><button data-role="Director">Director</button><button data-role="Executive">Executive</button><button data-role="Admin" class="active">Admin</button><button data-role="Employee">Employee</button></div></div><nav class="nav" id="nav"></nav></aside><main class="main" id="screen"></main></div><div class="dev">DEMO · NONPRODUCTION</div>
<script>
const routes={Director:[['/director','Director Dashboard'],['/rating','Рейтинг'],['/profile','Профиль'],['/exports','Экспорт']],Executive:[['/executive','Executive Dashboard'],['/rating','Рейтинг'],['/profile','Профиль'],['/exports','Экспорт']],Admin:[['/admin','Admin Panel'],['/admin/users','Пользователи и роли'],['/admin/org','Оргструктура'],['/admin/calendar','Календарь'],['/admin/taxonomy','Taxonomy'],['/admin/tools','AI Tools'],['/admin/audit','Audit / Trace'],['/exports','Экспорт']],Employee:[['/','Главная'],['/history','История'],['/rating','Рейтинг'],['/profile','Профиль']]};
let role='Admin',route='/admin';const nav=document.querySelector('#nav'),screen=document.querySelector('#screen');
function metric(label,value){return `<section class="metric"><span>${label}</span><b>${value}</b></section>`}
function forbidden(){return `<div class="forbidden"><div class="eyebrow">403 · RBAC</div><h1>Доступ запрещён</h1><p class="note">Роль ${role} не имеет доступа к ${route}. Backend authorization authoritative.</p></div>`}
function render(){document.querySelectorAll('[data-role]').forEach(b=>b.classList.toggle('active',b.dataset.role===role));nav.innerHTML=routes[role].map(([r,l])=>`<button data-route="${r}" class="${r===route?'active':''}">${l}</button>`).join('');nav.querySelectorAll('[data-route]').forEach(b=>b.onclick=()=>{route=b.dataset.route;render()});const allowed=routes[role].some(([r])=>r===route)||['/rating','/profile'].includes(route);if(!allowed){screen.innerHTML=forbidden();return}screen.innerHTML=content();}
function content(){if(route==='/director')return `<div class="top"><div><div class="eyebrow">Own directorate only</div><h1>Director Dashboard</h1><p class="note">Полная аналитика своей дирекции; technical trace недоступен.</p></div></div><div class="metrics">${metric('Headcount',32)}${metric('Total Score','6 298')}${metric('Average Score','196.8')}${metric('Rank','#2')}</div><div class="card"><h2>Сотрудники</h2><div class="row"><b>Алексей Ветров</b><span class="tag">452</span></div><div class="row"><b>Дмитрий Примеров</b><span class="tag">186</span></div></div>`;
if(route==='/executive')return `<div class="top"><div><div class="eyebrow">Whole company</div><h1>Executive Dashboard</h1><p class="note">Company-wide drill-down без управления системными настройками.</p></div></div><div class="metrics">${metric('Headcount',118)}${metric('AI-кейсов','1 264')}${metric('Avg Score / employee','184.6')}</div><div class="card"><h2>Дирекции</h2><div class="row"><b>Цифровые решения</b><span>#1 · 214.4</span></div><div class="row"><b>Коммерческая дирекция</b><span>#2 · 196.8</span></div></div>`;
if(route==='/admin')return `<div class="top"><div><div class="eyebrow">Admin shell</div><h1>Admin Panel</h1><p class="note">Users / org / calendar / taxonomy / tools / audit / export.</p></div></div><div class="grid"><div class="card"><h2>Системное управление</h2><p class="note">Управление ролями и справочниками логируется.</p></div><div class="card"><h2>Score invariant</h2><p class="note">Admin не может вручную менять Complexity или Score.</p></div></div>`;
if(route==='/admin/users')return `<div class="top"><div><div class="eyebrow">Admin</div><h1>Пользователи и роли</h1></div></div><div class="card"><div class="row"><b>Марина Орлова</b><span><span class="tag">employee</span> <span class="tag ok">active</span></span></div><div class="row"><b>Дарья Лукина</b><span><span class="tag">employee</span> <span class="tag bad">blocked</span></span></div></div>`;
if(route==='/admin/org')return `<div class="top"><div><div class="eyebrow">Admin</div><h1>Оргструктура</h1></div></div><div class="card"><div class="row"><b>Коммерческая дирекция</b><span class="tag ok">active</span></div><div class="row"><b>Цифровые решения</b><span class="tag ok">active</span></div></div>`;
if(route==='/admin/calendar')return `<div class="top"><div><div class="eyebrow">Europe/Moscow</div><h1>Корпоративный календарь</h1></div></div><div class="card"><div class="row"><b>01.09.2026</b><span class="tag ok">Рабочий</span></div><div class="row"><b>05.09.2026</b><span class="tag">Weekend</span></div></div>`;
if(route==='/admin/taxonomy')return `<div class="top"><div><div class="eyebrow">Versioned</div><h1>Taxonomy</h1></div></div><div class="grid"><div class="card"><h2>1.0 · active</h2><div class="row"><b>Аналитика и работа с данными</b><span class="tag ok">active</span></div><div class="row"><b>Research</b><span class="tag ok">active</span></div></div><div class="card"><h2>1.1-draft</h2><p class="note">Draft можно редактировать и активировать; старые задачи не переклассифицируются автоматически.</p></div></div>`;
if(route==='/admin/tools')return `<div class="top"><div><div class="eyebrow">Canonical directory</div><h1>AI Tools Directory</h1></div></div><div class="card"><div class="row"><b>ChatGPT</b><span>OpenAI · active</span></div><div class="row"><b>Perplexity</b><span>AI search · active</span></div><div class="row"><b>Demo AI Tool</b><span class="tag">unrecognized queue</span></div></div>`;
if(route==='/admin/audit')return `<div class="top"><div><div class="eyebrow">Admin only</div><h1>Audit / Technical Trace</h1><p class="note">Trace read-only.</p></div></div><div class="grid"><div class="card"><h2>Audit log</h2><div class="row"><b>employee.update</b><span>admin</span></div><div class="row"><b>task.scored</b><span>ai</span></div></div><div class="card"><h2>Technical trace</h2><div class="row"><b>Complexity / Score</b><span>C3 · 15</span></div><div class="row"><b>Clarifications</b><span>2 / 3</span></div><p class="note">Нет control для ручного Score override.</p></div></div>`;
if(route==='/exports')return `<div class="top"><div><div class="eyebrow">Role-derived scope</div><h1>Экспорт</h1></div></div><div class="card"><div class="row"><b>Доступный scope</b><span class="tag">${role==='Director'?'directorate':'company / directorate'}</span></div><div class="row"><b>Status demo</b><span class="tag ok">completed</span></div><p class="note">Director не может запросить company export.</p></div>`;
return `<div class="top"><div><div class="eyebrow">Shared authenticated</div><h1>${route==='/rating'?'Рейтинг':'Профиль'}</h1><p class="note">Shared Stage-6 surface; role-aware drill-down включён в Stage 7.</p></div></div>`}
document.querySelectorAll('[data-role]').forEach(b=>b.onclick=()=>{role=b.dataset.role;route=routes[role][0][0];render()});render();</script></body></html>
