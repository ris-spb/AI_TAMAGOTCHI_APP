<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI-Тамагочи · Stage 3 Shell Preview</title>
<style>
:root{--bg:#f5f1e9;--surface:#faf8f3;--surface2:#e9e1d5;--text:#292824;--muted:#6c675e;--accent:#d39a3c;--border:rgba(41,40,36,.14);--radius:12px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}button{font:inherit}
.app{min-height:100vh;display:flex}aside{display:none;width:224px;flex:0 0 224px;background:var(--surface);border-right:1px solid var(--border);padding:24px 16px;overflow:auto}.brand{font-weight:700;margin-bottom:20px}.brand small{display:block;color:var(--muted);font-weight:400;margin-top:2px}.side-links{display:grid;gap:4px}.side-links button{border:0;background:transparent;text-align:left;min-height:44px;padding:8px 12px;border-radius:8px;color:var(--muted);cursor:pointer}.side-links button.active,.side-links button:hover{background:var(--surface2);color:var(--text)}
.viewport{min-width:0;flex:1;display:flex;flex-direction:column;min-height:100vh}header{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:60px;padding:12px 18px;background:var(--surface);border-bottom:1px solid var(--border)}header .meta{display:grid;gap:1px;min-width:0}header code{font-size:10px;color:var(--muted)}header strong{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}select{min-height:36px;border:1px solid var(--border);border-radius:8px;background:var(--surface2);padding:0 8px;color:var(--text)}main{width:100%;max-width:1100px;margin:0 auto;padding:24px 18px 100px;display:grid;gap:24px}.hero p{margin:0 0 4px;color:var(--muted);font-size:12px;font-weight:700;letter-spacing:.06em}h1{font-size:24px;line-height:30px;margin:0}.path{color:var(--muted);font-size:14px}.panel{min-height:320px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:24px;display:grid;align-content:start;gap:16px;box-shadow:0 1px 6px rgba(41,40,36,.06)}.line{height:18px;background:var(--surface2);border-radius:8px;width:82%}.line.short{height:14px;width:54%}.cards{display:grid;gap:12px}.cards i{display:block;height:78px;background:var(--surface2);border-radius:8px}.note{color:var(--muted);line-height:1.45}.forbidden{border-color:#b95e56}.route-picker{display:flex;flex-wrap:wrap;gap:8px}.route-picker button{min-height:40px;border:1px solid var(--border);border-radius:8px;background:var(--surface);padding:0 10px;color:var(--text);cursor:pointer}.route-picker button:hover{background:var(--surface2)}
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:10;min-height:68px;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:4px 8px;background:var(--surface);border-top:1px solid var(--border)}.bottom button{border:0;border-radius:8px;background:transparent;color:var(--muted);min-height:52px;cursor:pointer}.bottom button.active{background:var(--surface2);color:var(--text);font-weight:600}
.demo{font-size:12px;color:var(--muted);padding:8px 18px;border-bottom:1px dashed var(--border);background:var(--surface)}
@media(min-width:768px){aside{display:block}.bottom{display:none}main{padding:32px 24px}header{padding-inline:24px}.cards{grid-template-columns:repeat(3,1fr)}}
</style>
</head><body>
<div class="app"><aside><div class="brand">Любознайка<small>Stage 3 shell preview</small></div><div id="sideLinks" class="side-links"></div></aside><div class="viewport"><header><div class="meta"><code id="screenId"></code><strong id="screenName"></strong></div><select id="role"><option value="employee">Employee</option><option value="director">Director</option><option value="executive">Executive</option><option value="admin">Admin</option></select></header><div class="demo">DEMO-ONLY dependency-free preview · React/Vite runtime не используется</div><main><section class="hero"><p>PROTOTYPE STAGE 3 · ROUTE SKELETON</p><h1 id="title"></h1><div id="path" class="path"></div></section><section id="panel" class="panel"><div class="line"></div><div class="line short"></div><div class="cards"><i></i><i></i><i></i></div><p id="note" class="note"></p></section><section><p class="path">Все 36 active semantic screens:</p><div id="routePicker" class="route-picker"></div></section></main><nav class="bottom" aria-label="Основная навигация"><button data-path="/">Главная</button><button data-path="/history">История</button><button data-path="/rating">Рейтинг</button><button data-path="/profile">Профиль</button></nav></div></div>
<script>
const routes=[{"screenId": "SCR_AUTH_LOGIN", "screenName": "First Login / Personnel Verification", "path": "/login", "roles": ["public"], "routeClass": "PUBLIC", "platform": "Mobile/Web", "shell": "public"}, {"screenId": "SCR_ONBOARDING", "screenName": "Onboarding", "path": "/onboarding", "roles": ["authenticated"], "routeClass": "AUTH_GATE", "platform": "Mobile/Web", "shell": "authenticated"}, {"screenId": "SCR_GOAL_SETUP", "screenName": "Monthly Goal Setup", "path": "/goals/setup", "roles": ["employee"], "routeClass": "DATA_GATE", "platform": "Mobile/Web", "shell": "employee"}, {"screenId": "SCR_HOME", "screenName": "Home", "path": "/", "roles": ["employee"], "routeClass": "PRIMARY_TAB", "platform": "Mobile primary / responsive web", "shell": "employee"}, {"screenId": "SCR_CASE_ADD", "screenName": "Add AI Case — Text", "path": "/ai-cases/new", "roles": ["employee"], "routeClass": "FLOW", "platform": "Mobile/Web", "shell": "employee"}, {"screenId": "SCR_CASE_VOICE", "screenName": "Voice Recording / STT", "path": "/ai-cases/new/voice", "roles": ["employee"], "routeClass": "FLOW", "platform": "Mobile primary", "shell": "employee"}, {"screenId": "SCR_CASE_TRANSCRIPT", "screenName": "Transcript Preview / Edit", "path": "/ai-cases/new/transcript", "roles": ["employee"], "routeClass": "FLOW_EPHEMERAL", "platform": "Mobile/Web", "shell": "employee"}, {"screenId": "SCR_CASE_PROCESSING", "screenName": "AI Processing", "path": "/ai-cases/:taskId/processing", "roles": ["employee"], "routeClass": "FLOW", "platform": "Mobile/Web", "shell": "employee"}, {"screenId": "SCR_CASE_CLARIFY", "screenName": "Clarification 1–3", "path": "/ai-cases/:taskId/clarify", "roles": ["employee"], "routeClass": "FLOW", "platform": "Mobile/Web", "shell": "employee"}, {"screenId": "SCR_CASE_RESULT", "screenName": "Task Result", "path": "/ai-cases/:taskId/result", "roles": ["employee"], "routeClass": "FLOW", "platform": "Mobile/Web", "shell": "employee"}, {"screenId": "SCR_CASE_DETAIL", "screenName": "AI Case Detail", "path": "/ai-cases/:taskId", "roles": ["employee", "director", "executive", "admin"], "routeClass": "OBJECT_SCOPED", "platform": "Mobile/Web", "shell": "authenticated"}, {"screenId": "SCR_CASE_EDIT", "screenName": "Edit AI Case", "path": "/ai-cases/:taskId/edit", "roles": ["employee"], "routeClass": "OWNER_ONLY", "platform": "Mobile/Web", "shell": "employee"}, {"screenId": "SCR_HISTORY_TASKS", "screenName": "History — Tasks", "path": "/history", "roles": ["employee"], "routeClass": "PRIMARY_TAB", "platform": "Mobile/Web", "shell": "employee"}, {"screenId": "SCR_HISTORY_EVENTS", "screenName": "History — Events", "path": "/history/events", "roles": ["employee"], "routeClass": "SUBROUTE", "platform": "Mobile/Web", "shell": "employee"}, {"screenId": "SCR_GOALS", "screenName": "Monthly Goals — Active", "path": "/goals", "roles": ["employee"], "routeClass": "SUBROUTE", "platform": "Mobile/Web", "shell": "employee"}, {"screenId": "SCR_RATING_EMPLOYEES", "screenName": "Rating — Employees", "path": "/rating", "roles": ["employee", "director", "executive", "admin"], "routeClass": "PRIMARY_TAB", "platform": "Mobile/Web", "shell": "authenticated"}, {"screenId": "SCR_RATING_DIRECTORATES", "screenName": "Rating — Directorates", "path": "/rating/directorates", "roles": ["employee", "director", "executive", "admin"], "routeClass": "SUBROUTE", "platform": "Mobile/Web", "shell": "authenticated"}, {"screenId": "SCR_COMPANY_ANALYTICS", "screenName": "Rating — Analytics", "path": "/rating/analytics", "roles": ["employee", "director", "executive", "admin"], "routeClass": "SUBROUTE", "platform": "Web/Mobile", "shell": "authenticated"}, {"screenId": "SCR_DIRECTORATE_CARD", "screenName": "Directorate Card", "path": "/rating/directorates/:directorateId", "roles": ["employee", "director", "executive", "admin"], "routeClass": "OBJECT_SCOPED", "platform": "Mobile/Web", "shell": "authenticated"}, {"screenId": "SCR_PUBLIC_PROFILE", "screenName": "Public Employee Profile", "path": "/profiles/:employeeId", "roles": ["employee", "director", "executive", "admin"], "routeClass": "OBJECT_SCOPED", "platform": "Mobile/Web", "shell": "authenticated"}, {"screenId": "SCR_PROFILE_SELF", "screenName": "Profile / Personal Dashboard", "path": "/profile", "roles": ["employee", "director", "executive", "admin"], "routeClass": "PRIMARY_OR_SELF", "platform": "Mobile/Web", "shell": "authenticated"}, {"screenId": "SCR_PRIVACY", "screenName": "Privacy Settings", "path": "/profile/privacy", "roles": ["employee", "director", "executive", "admin"], "routeClass": "SELF", "platform": "Mobile/Web", "shell": "authenticated"}, {"screenId": "SCR_VACATION", "screenName": "Vacation Settings", "path": "/profile/vacation", "roles": ["employee", "director", "executive", "admin"], "routeClass": "SELF", "platform": "Mobile/Web", "shell": "authenticated"}, {"screenId": "SCR_ACHIEVEMENTS", "screenName": "Achievements / Collection", "path": "/profile/achievements", "roles": ["employee", "director", "executive", "admin"], "routeClass": "SELF", "platform": "Mobile/Web", "shell": "authenticated"}, {"screenId": "SCR_SCORING_INFO", "screenName": "How Scoring Works", "path": "/profile/scoring", "roles": ["employee", "director", "executive", "admin"], "routeClass": "AUTHENTICATED", "platform": "Mobile/Web", "shell": "authenticated"}, {"screenId": "SCR_NOTIFICATIONS", "screenName": "Notifications", "path": "/notifications", "roles": ["employee", "director", "executive", "admin"], "routeClass": "SELF", "platform": "Mobile/Web", "shell": "authenticated"}, {"screenId": "SCR_DIRECTOR_DASH", "screenName": "Director Dashboard", "path": "/director", "roles": ["director"], "routeClass": "ROLE_DIRECTOR", "platform": "Desktop/Web primary", "shell": "management"}, {"screenId": "SCR_EXEC_DASH", "screenName": "Executive Dashboard", "path": "/executive", "roles": ["executive"], "routeClass": "ROLE_EXECUTIVE", "platform": "Desktop/Web primary", "shell": "management"}, {"screenId": "SCR_ADMIN_PANEL", "screenName": "Admin Panel", "path": "/admin", "roles": ["admin"], "routeClass": "ROLE_ADMIN_SHELL", "platform": "Desktop/Web primary", "shell": "management"}, {"screenId": "SCR_ADMIN_USERS", "screenName": "Admin — Users & Roles", "path": "/admin/users", "roles": ["admin"], "routeClass": "ROLE_ADMIN", "platform": "Desktop/Web", "shell": "management"}, {"screenId": "SCR_ADMIN_ORG", "screenName": "Admin — Org Structure", "path": "/admin/org", "roles": ["admin"], "routeClass": "ROLE_ADMIN", "platform": "Desktop/Web", "shell": "management"}, {"screenId": "SCR_ADMIN_CALENDAR", "screenName": "Admin — Corporate Calendar", "path": "/admin/calendar", "roles": ["admin"], "routeClass": "ROLE_ADMIN", "platform": "Desktop/Web", "shell": "management"}, {"screenId": "SCR_ADMIN_TAXONOMY", "screenName": "Admin — Taxonomy", "path": "/admin/taxonomy", "roles": ["admin"], "routeClass": "ROLE_ADMIN", "platform": "Desktop/Web", "shell": "management"}, {"screenId": "SCR_ADMIN_TOOLS", "screenName": "Admin — AI Tools Directory", "path": "/admin/tools", "roles": ["admin"], "routeClass": "ROLE_ADMIN", "platform": "Desktop/Web", "shell": "management"}, {"screenId": "SCR_ADMIN_AUDIT", "screenName": "Admin — Audit / Technical Trace", "path": "/admin/audit", "roles": ["admin"], "routeClass": "ROLE_ADMIN", "platform": "Desktop/Web", "shell": "management"}, {"screenId": "SCR_ADMIN_EXPORT", "screenName": "Management Export", "path": "/exports", "roles": ["director", "executive", "admin"], "routeClass": "ROLE_SCOPED", "platform": "Desktop/Web", "shell": "management"}];
let role='employee', current='/';
const $=id=>document.getElementById(id);
function matchRoute(path){return routes.find(r=>r.path===path)||routes.find(r=>r.path.replace(/:[^/]+/g,'demo')===path)||routes[3]}
function allowed(r){return r.roles.includes('public')||r.roles.includes('authenticated')||r.roles.includes(role)}
function roleHome(){return role==='employee'?'/':role==='director'?'/director':role==='executive'?'/executive':'/admin'}
function navItems(){if(role==='employee')return [['Главная','/'],['История','/history'],['Рейтинг','/rating'],['Профиль','/profile']];if(role==='director')return [['Director Dashboard','/director'],['Рейтинг','/rating'],['Профиль','/profile'],['Экспорт','/exports']];if(role==='executive')return [['Executive Dashboard','/executive'],['Рейтинг','/rating'],['Профиль','/profile'],['Экспорт','/exports']];return [['Admin Panel','/admin'],['Пользователи и роли','/admin/users'],['Оргструктура','/admin/org'],['Календарь','/admin/calendar'],['Taxonomy','/admin/taxonomy'],['AI Tools','/admin/tools'],['Audit / Technical Trace','/admin/audit'],['Экспорт','/exports'],['Рейтинг','/rating'],['Профиль','/profile']]}
function go(path){current=path;render()}
function render(){const r=matchRoute(current);$('screenId').textContent=r.screenId;$('screenName').textContent=r.screenName;$('title').textContent=r.screenName;$('path').textContent=r.path+' · '+r.platform;const ok=allowed(r);$('panel').classList.toggle('forbidden',!ok);$('note').textContent=ok?'Содержательная реализация экрана будет добавлена на следующих этапах. Shell, responsive boundary и route contract уже зафиксированы.':'403 · Этот маршрут недоступен для роли '+role+'. Prototype UX guard не заменяет backend RBAC.';
$('sideLinks').innerHTML='';for(const [label,path] of navItems()){const b=document.createElement('button');b.textContent=label;b.className=current===path?'active':'';b.onclick=()=>go(path);$('sideLinks').appendChild(b)}
$('routePicker').innerHTML='';for(const x of routes){const b=document.createElement('button');b.textContent=x.screenId;b.title=x.screenName+' · '+x.path;b.onclick=()=>go(x.path.replace(':taskId','demo').replace(':directorateId','demo').replace(':employeeId','demo'));$('routePicker').appendChild(b)}
document.querySelectorAll('.bottom button').forEach(b=>b.classList.toggle('active',current===b.dataset.path));}
$('role').onchange=e=>{role=e.target.value;current=roleHome();render()};document.querySelectorAll('.bottom button').forEach(b=>b.onclick=()=>go(b.dataset.path));render();
</script></body></html>
